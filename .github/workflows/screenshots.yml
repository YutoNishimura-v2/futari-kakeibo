name: iOS screenshots

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  screenshots:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    concurrency:
      group: ci-shots
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare project and simulator
        id: prepare
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p tmp/ci-logs
          {
            if ! command -v xcodegen >/dev/null; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
            fi
            xcodegen generate
            defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
            device="$(xcrun simctl list devices available -j | python3 .github/scripts/pick-simulator.py)"
            echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time "9:41" --dataNetwork wifi \
              --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 \
              --batteryState discharging --batteryLevel 100
          } 2>&1 | tee tmp/ci-logs/prepare.log

      - name: Build and capture
        id: capture
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p tmp/ci-logs
          xcodebuild test -project FutariKakeibo.xcodeproj -scheme FutariScreenshots \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath tmp/screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee tmp/ci-logs/capture.log

      - name: Export screenshot attachments
        id: export
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p tmp/ci-logs
          {
            xcrun xcresulttool export attachments --path tmp/screenshots.xcresult --output-path tmp/attachments
            python3 .github/scripts/export-screenshots.py
          } 2>&1 | tee tmp/ci-logs/export.log

      - name: Publish the screenshot branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p tmp/ci-logs
          bash .github/scripts/publish-ci-shots.sh tmp/ci-shots 2>&1 | tee tmp/ci-logs/publish.log

      - name: Keep the step logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: tmp/ci-logs
          if-no-files-found: ignore

      - name: Publish the failure report
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -eo pipefail
          rm -rf tmp/ci-failure
          node .github/scripts/ci-failure-report.mjs tmp/ci-failure
          bash .github/scripts/publish-ci-shots.sh tmp/ci-failure
