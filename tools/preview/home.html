<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ふたりの家計簿 — Home Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg-grouped: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-nav: rgba(249, 249, 249, 0.94);
      --separator: rgba(60, 60, 67, 0.24);
      --label: #000000;
      --secondary-label: rgba(60, 60, 67, 0.65);
      --disclosure: rgba(60, 60, 67, 0.35);
      --tint: #007AFF;
      --tone-ok: rgb(23, 73, 56);
      --track: rgba(120, 120, 128, 0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      min-height: 844px;
      background: var(--bg-grouped);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .nav-bar {
      height: 44px;
      padding: 0 16px;
      background: var(--bg-nav);
      border-bottom: 0.5px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .nav-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: -0.02em;
    }
    .nav-trailing {
      position: absolute;
      right: 16px;
      top: 0;
      height: 44px;
      display: flex;
      align-items: center;
      color: var(--tint);
    }
    .list {
      padding: 12px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
    }
    .settlement-card {
      padding: 14px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settlement-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .settlement-title {
      font-size: 27px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .settlement-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      border-top: 0.5px solid rgba(60, 60, 67, 0.14);
    }
    .share-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: var(--secondary-label);
      background: rgba(120, 120, 128, 0.1);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .month-menu {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--tint);
      font-size: 14.5px;
      font-weight: 500;
      white-space: nowrap;
    }
    .prominent-button {
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      background: var(--tint);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 16.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
    }
    .row {
      padding: 10px 16px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .separator {
      height: 0.5px;
      margin-left: 16px;
      background: var(--separator);
    }
    .expense-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .expense-icon {
      color: var(--tint);
      flex-shrink: 0;
    }
    .expense-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .body-text {
      font-size: 16px;
      line-height: 21px;
      font-weight: 400;
    }
    .sub-text {
      font-size: 12.5px;
      line-height: 17px;
      color: var(--secondary-label);
    }
    .headline-digits {
      font-size: 16.5px;
      line-height: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .all-details-link {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--tint);
    }
    .yen-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .secondary-digits {
      font-size: 16px;
      line-height: 21px;
      color: var(--secondary-label);
      font-variant-numeric: tabular-nums;
    }
    .donut-wrap {
      padding: 6px 16px 10px;
      display: flex;
      justify-content: center;
      position: relative;
    }
    .donut-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }
    .donut-center-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--secondary-label);
    }
    .donut-center-value {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }
    .cat-row {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      line-height: 20px;
    }
    .cat-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .budget-card-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .budget-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .budget-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--tone-ok);
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--track);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--tone-ok);
      width: 59.18%;
    }
    .budget-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }
    .tone-ok { color: var(--tone-ok); font-weight: 600; }
    .chevron-muted { color: var(--disclosure); flex-shrink: 0; }
    .chevron-tint { color: var(--tint); flex-shrink: 0; }
  </style>
</head>
<body>
  <header class="nav-bar">
    <h1 class="nav-title">ふたりの家計簿</h1>
    <div class="nav-trailing" aria-hidden="true">
      <svg width="24" height="18" viewBox="0 0 24 18" fill="none">
        <circle cx="9.5" cy="5.5" r="3" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 15.5c0-3 2.7-4.8 6-4.8s6 1.8 6 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="16.5" cy="6.5" r="2.3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M16.5 11c2.4 0 4.3 1.3 4.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <main class="list">
    <section class="card">
      <div class="settlement-card">
        <div class="settlement-link">
          <div class="settlement-title">あおいから 3,110円 受け取る</div>
          <svg class="chevron-muted" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
            <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="settlement-meta">
          <span class="share-pill">
            <svg width="14" height="11" viewBox="0 0 24 18" fill="none" aria-hidden="true">
              <circle cx="9.5" cy="5.5" r="3" fill="currentColor"/>
              <path d="M3.5 15.5c0-3 2.7-4.8 6-4.8s6 1.8 6 4.8" fill="currentColor"/>
              <circle cx="16.5" cy="6.5" r="2.3" fill="currentColor"/>
              <path d="M16.5 11c2.4 0 4.3 1.3 4.5 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span>はる・あおい で共有中</span>
          </span>
          <div class="month-menu">
            <span>2026年6月</span>
            <svg width="11" height="7" viewBox="0 0 11 7" fill="none" aria-hidden="true">
              <path d="M1 1.25L5.5 5.75L10 1.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <button class="prominent-button" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 2.5V13.5M2.5 8H13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>支出を記録</span>
    </button>

    <section class="card">
      <div class="row">
        <div class="expense-left">
          <svg class="expense-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M6.5 3.5V9M4.5 3.5V7C4.5 8.1 5.4 9 6.5 9C7.6 9 8.5 8.1 8.5 7V3.5M6.5 9V16.5M14 3.5V16.5M14 3.5C15.4 3.5 16 5.2 16 7.5C16 9.5 15.2 10.5 14 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="expense-text">
            <div class="body-text">ふたりの夕食</div>
            <div class="sub-text"><span>外食</span><span> · 6/14 · </span><span>あおいが支払い</span></div>
          </div>
        </div>
        <span class="headline-digits">4,600円</span>
        <svg class="chevron-muted" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
          <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="separator"></div>
      <div class="row">
        <span class="all-details-link">今月の明細をすべて見る</span>
        <svg class="chevron-tint" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
          <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="budget-card-inner">
          <div class="budget-top">
            <span class="body-text">今月の予算</span>
            <span class="budget-value">残り 8,980円</span>
          </div>
          <div class="progress-track"><div class="progress-fill"></div></div>
          <div class="budget-foot">
            <span class="tone-ok">使用 59%（残り 41%）</span>
            <span class="sub-text">予算 22,000円</span>
          </div>
        </div>
        <svg class="chevron-muted" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
          <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="yen-row">
          <span class="body-text">支出合計</span>
          <span class="secondary-digits">15,420円</span>
        </div>
        <svg class="chevron-tint" width="13" height="8" viewBox="0 0 11 7" fill="none" aria-hidden="true">
          <path d="M1 1.25L5.5 5.75L10 1.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="separator"></div>
      <div class="donut-wrap">
        <svg width="156" height="156" viewBox="0 0 156 156" aria-hidden="true">
          <circle cx="78" cy="78" r="62" fill="none" stroke="rgb(23, 73, 56)" stroke-width="20" stroke-dasharray="212.7 176.9" stroke-dashoffset="97.4"/>
          <circle cx="78" cy="78" r="62" fill="none" stroke="rgb(31, 98, 142)" stroke-width="20" stroke-dasharray="116.2 273.4" stroke-dashoffset="-115.3"/>
          <circle cx="78" cy="78" r="62" fill="none" stroke="rgb(158, 84, 18)" stroke-width="20" stroke-dasharray="60.6 329.0" stroke-dashoffset="-231.5"/>
        </svg>
        <div class="donut-center">
          <div class="donut-center-title">支出合計</div>
          <div class="donut-center-value">15,420円</div>
        </div>
      </div>
      <div class="separator"></div>
      <div class="cat-row">
        <div class="cat-left"><span class="swatch" style="background: rgb(23, 73, 56);"></span><span>食料品</span></div>
        <span class="secondary-digits">8,420円</span>
      </div>
      <div class="separator"></div>
      <div class="cat-row">
        <div class="cat-left"><span class="swatch" style="background: rgb(31, 98, 142);"></span><span>外食</span></div>
        <span class="secondary-digits">4,600円</span>
      </div>
      <div class="separator"></div>
      <div class="cat-row">
        <div class="cat-left"><span class="swatch" style="background: rgb(158, 84, 18);"></span><span>日用品</span></div>
        <span class="secondary-digits">2,400円</span>
      </div>
    </section>
  </main>
</body>
</html>
