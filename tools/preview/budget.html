<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>費目別予算 — Budget Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg-grouped: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-nav: rgba(249, 249, 249, 0.94);
      --separator: rgba(60, 60, 67, 0.24);
      --label: #000000;
      --secondary-label: rgba(60, 60, 67, 0.65);
      --disclosure: rgba(60, 60, 67, 0.35);
      --tint: #007AFF;
      --tone-ok: rgb(23, 73, 56);
      --tone-over: rgb(166, 27, 41);
      --track: rgba(120, 120, 128, 0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      min-height: 844px;
      background: var(--bg-grouped);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .nav-bar {
      height: 44px;
      padding: 0 12px;
      background: var(--bg-nav);
      border-bottom: 0.5px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .nav-back {
      position: absolute;
      left: 8px;
      top: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--tint);
      font-size: 17px;
    }
    .nav-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: -0.02em;
    }
    .list {
      padding: 14px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-header {
      padding: 0 12px 6px;
      font-size: 13px;
      line-height: 18px;
      color: var(--secondary-label);
    }
    .card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
    }
    .month-row {
      padding: 10px 16px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .month-menu {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--tint);
      font-size: 17px;
      font-weight: 600;
    }
    .row {
      padding: 11px 16px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .progress-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title-with-icon {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      line-height: 21px;
    }
    .title-plain {
      font-size: 16px;
      font-weight: 600;
      line-height: 21px;
    }
    .cat-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .budget-limit {
      font-size: 14px;
      line-height: 19px;
      color: var(--secondary-label);
      font-variant-numeric: tabular-nums;
    }
    .bar-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: var(--track);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
    }
    .pct-label {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .bottom-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .headline {
      font-size: 17px;
      line-height: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .subheadline {
      font-size: 14px;
      line-height: 19px;
      color: var(--secondary-label);
      font-variant-numeric: tabular-nums;
    }
    .tone-ok { color: var(--tone-ok); }
    .tone-over { color: var(--tone-over); }
    .tone-ok-bg { background: var(--tone-ok); }
    .tone-over-bg { background: var(--tone-over); }
    .separator {
      height: 0.5px;
      margin-left: 16px;
      background: var(--separator);
    }
    .disclosure-row {
      padding: 12px 16px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      line-height: 21px;
    }
    .chevron-muted { color: var(--disclosure); flex-shrink: 0; }
  </style>
</head>
<body>
  <header class="nav-bar">
    <div class="nav-back">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true">
        <path d="M9.5 1.5L2 9L9.5 16.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>月の明細</span>
    </div>
    <h1 class="nav-title">費目別予算</h1>
  </header>

  <main class="list">
    <section class="card">
      <div class="month-row">
        <div class="month-menu">
          <span>2026年6月</span>
          <svg width="12" height="8" viewBox="0 0 11 7" fill="none" aria-hidden="true">
            <path d="M1 1.25L5.5 5.75L10 1.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="separator"></div>
      <div class="row">
        <div class="progress-stack">
          <div class="top-line">
            <span class="title-plain">予算の合計</span>
            <span class="budget-limit">予算 22,000円</span>
          </div>
          <div class="bar-line">
            <div class="progress-track"><div class="progress-fill tone-ok-bg" style="width: 59.18%"></div></div>
            <span class="pct-label tone-ok">使用 59%（残り 41%）</span>
          </div>
          <div class="bottom-line">
            <span class="headline tone-ok">残り 8,980円</span>
            <span class="subheadline">支払済 13,020円</span>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="section-header">設定済みの費目</div>
      <div class="card">
        <div class="row">
          <div class="progress-stack">
            <div class="top-line">
              <div class="title-with-icon">
                <svg class="cat-icon tone-ok" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M3 4H5.2L6.8 12.5H15.2L16.8 6.5H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="7.5" cy="15.5" r="1.3" fill="currentColor"/>
                  <circle cx="14.5" cy="15.5" r="1.3" fill="currentColor"/>
                </svg>
                <span>食料品</span>
              </div>
              <span class="budget-limit">予算 18,000円</span>
            </div>
            <div class="bar-line">
              <div class="progress-track"><div class="progress-fill tone-ok-bg" style="width: 46.78%"></div></div>
              <span class="pct-label tone-ok">使用 47%（残り 53%）</span>
            </div>
            <div class="bottom-line">
              <span class="headline tone-ok">残り 9,580円</span>
              <span class="subheadline">支払済 8,420円</span>
            </div>
          </div>
          <svg class="chevron-muted" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
            <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="separator"></div>
        <div class="row">
          <div class="progress-stack">
            <div class="top-line">
              <div class="title-with-icon">
                <svg class="cat-icon tone-over" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M6.5 3.5V9M4.5 3.5V7C4.5 8.1 5.4 9 6.5 9C7.6 9 8.5 8.1 8.5 7V3.5M6.5 9V16.5M14 3.5V16.5M14 3.5C15.4 3.5 16 5.2 16 7.5C16 9.5 15.2 10.5 14 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>外食</span>
              </div>
              <span class="budget-limit">予算 4,000円</span>
            </div>
            <div class="bar-line">
              <div class="progress-track"><div class="progress-fill tone-over-bg" style="width: 100%"></div></div>
              <span class="pct-label tone-over">超過 15%</span>
            </div>
            <div class="bottom-line">
              <span class="headline tone-over">超過 600円</span>
              <span class="subheadline">支払済 4,600円</span>
            </div>
          </div>
          <svg class="chevron-muted" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
            <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="disclosure-row">
        <span>予算を追加する費目（6）</span>
        <svg class="chevron-muted" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
          <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
