name: FutariKakeibo
fileGroups: [FutariKakeibo.storekit]
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    LEDGER_PLAN: free
    LEDGER_APP_GROUP: group.local.futarikakeibo
    LEDGER_LEGAL_BASE_URL: ''
targets:
  FutariDomain:
    type: framework
    platform: iOS
    sources: [Sources/FutariDomain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.futarikakeibo.domain
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
  FutariKakeibo:
    type: application
    platform: iOS
    sources:
      - path: Sources/FutariKakeibo
        excludes: [PrivacyInfo.xcprivacy]
      - path: Sources/FutariKakeibo/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: docs/legal/privacy.md
        buildPhase: resources
      - path: docs/legal/terms.md
        buildPhase: resources
    dependencies:
      - target: FutariDomain
        embed: false
      - target: FutariWidget
        embed: true
    info:
      path: FutariKakeibo-Info.plist
      properties:
        CKSharingSupported: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LedgerCloudContainer: $(LEDGER_CLOUD_CONTAINER)
        LedgerPlan: $(LEDGER_PLAN)
        LedgerAppGroup: $(LEDGER_APP_GROUP)
        LedgerLegalBaseURL: $(LEDGER_LEGAL_BASE_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: FutariKakeibo.entitlements
      properties:
        aps-environment: $(LEDGER_APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers: [$(LEDGER_CLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [$(LEDGER_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.futarikakeibo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LEDGER_CLOUD_CONTAINER: iCloud.example.futarikakeibo
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_CFBundleDisplayName: ふたりの家計簿
      configs:
        Debug:
          LEDGER_APS_ENVIRONMENT: development
        Release:
          LEDGER_APS_ENVIRONMENT: production
  FutariWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FutariWidget
        excludes: [PrivacyInfo.xcprivacy]
      - path: Sources/FutariWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FutariDomain
        embed: false
    info:
      path: FutariWidget-Info.plist
      properties:
        CFBundleDisplayName: ふたりの家計簿
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LedgerPlan: $(LEDGER_PLAN)
        LedgerAppGroup: $(LEDGER_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FutariWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(LEDGER_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.futarikakeibo.app.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  FutariScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/FutariScreenshotTests
      - path: FutariKakeibo.storekit
        buildPhase: resources
    dependencies:
      - target: FutariKakeibo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.futarikakeibo.screenshots
        TEST_TARGET_NAME: FutariKakeibo
schemes:
  FutariKakeibo:
    build:
      targets:
        FutariKakeibo: all
    run:
      storeKitConfiguration: FutariKakeibo.storekit
  FutariScreenshots:
    build:
      targets:
        FutariKakeibo: all
        FutariScreenshotTests: [test]
    test:
      config: Debug
      targets: [FutariScreenshotTests]
